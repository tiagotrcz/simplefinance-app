# Numa tag v*, compila as imagens da API e do front e publica no GHCR.
# A VM só baixa as imagens: compilar .NET numa e2-micro (1 GB de RAM) trava.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: docker/api.Dockerfile
          - name: front
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          # Vazio = mesma origem: o SPA chama /api no próprio domínio e o nginx do front repassa.
          build-args: VITE_API_BASE_URL=
          tags: |
            ghcr.io/${{ github.repository_owner }}/simplefinance-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/simplefinance-${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
